name: Check contract sizes

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - src/**
      - foundry.toml
      - remappings.txt
      - script/ci/check_contract_sizes.py
      - script/ci/contract-size-budget.json
      - .github/workflows/contract-sizes.yml
  workflow_dispatch:

jobs:
  check_contract_sizes:
    name: Contract size budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the size table

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinned to match run-forge-tests.yaml; nightly is a moving target and has
          # changed size-limit behaviour before.
          version: v1.5.1

      - name: Measure sizes
        run: forge build --sizes --json > sizes.json

      # Fails the job past the budget in script/ci/contract-size-budget.json, and always
      # writes the table so margin is visible even on a green run.
      - name: Check budget
        id: budget
        run: python3 script/ci/check_contract_sizes.py --sizes sizes.json --report report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-sizes
          path: report.md

      - name: Post size table on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const COMMENT_MARKER = '<!-- contract-size-report -->';

            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            if (!prNumber) {
              console.log('Could not determine PR number, skipping comment');
              return;
            }

            let report;
            try {
              report = fs.readFileSync('report.md', 'utf8');
            } catch (err) {
              console.log(`Failed to read report.md: ${err.message}`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              COMMENT_MARKER,
              report.trimEnd(),
              '',
              `<sub>Generated by workflow run [#${context.runNumber}](${runUrl})</sub>`
            ].join('\n');

            // Update in place rather than adding a comment per push.
            const comments = [];
            let page = 1;
            let hasMore = true;
            while (hasMore) {
              const { data: pageComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
                page: page
              });
              comments.push(...pageComments);
              hasMore = pageComments.length === 100;
              page++;
            }

            const botComment = comments.find(c => c.body?.includes(COMMENT_MARKER));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
